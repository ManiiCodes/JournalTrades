services:
  - type: web
    name: orb-journal
    runtime: node
    plan: free
    rootDir: orb-journal
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        sync: false
      - key: APP_SECRET
        generateValue: true
      - key: ALLOW_SIGNUPS
        value: "true"
      - key: TRADOVATE_CLIENT_ID
        sync: false
      - key: TRADOVATE_CLIENT_SECRET
        sync: false
